name: backend

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bomatic
          POSTGRES_PASSWORD: bomatic
          POSTGRES_DB: bomatic
        ports:
          - 9876:5432
        options: >-
          --health-cmd "pg_isready -U bomatic -d bomatic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bomatic:bomatic@localhost:9876/bomatic
      BOMATIC_API_KEY: test-ci-key
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run unit and integration tests
        run: python -m pytest tests/ -q -p no:cacheprovider --basetemp=.test-tmp-p12 -m "not e2e"

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bomatic
          POSTGRES_PASSWORD: bomatic
          POSTGRES_DB: bomatic
        ports:
          - 9876:5432
        options: >-
          --health-cmd "pg_isready -U bomatic -d bomatic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bomatic:bomatic@localhost:9876/bomatic
      BOMATIC_API_KEY: test-ci-key
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run e2e tests
        run: python -m pytest tests/ -q -p no:cacheprovider --basetemp=.test-tmp-p12 -m e2e
